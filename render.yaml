services:
  - type: web
    name: spitball
    runtime: node
    plan: free
    autoDeploy: true
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: z-ai/glm-5.3-flash
      - key: OPENROUTER_CREATIVE_MODEL
        value: deepseek/deepseek-v4-flash-0731
      - key: FEATHERLESS_API_KEY
        sync: false
      - key: FEATHERLESS_CREATIVE_MODEL
        value: deepseek-ai/DeepSeek-V4-Flash-0731
      - key: FEATHERLESS_MODEL
        value: unsloth/Qwen3.8-27B
      - key: GITHUB_TOKEN
        sync: false

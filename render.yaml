services:
  - type: web
    name: spitball
    runtime: node
    plan: free
    autoDeploy: true
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: nvidia/nemotron-3.5-lightning
      - key: OPENROUTER_CREATIVE_MODEL
        value: deepseek/deepseek-v4-flash-0731
      - key: FEATHERLESS_API_KEY
        sync: false
      - key: FEATHERLESS_CREATIVE_MODEL
        value: deepseek-ai/DeepSeek-V4-Flash-0731
      - key: FEATHERLESS_MODEL
        value: nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-BF16
      - key: GITHUB_TOKEN
        sync: false
